<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت شیشه‌ای رنگی</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    body {
      background-color: #17212b;
      color: #ffffff;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      text-align: center;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      background: #242f3d;
      border-radius: 12px;
      color: #64b5f6;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }
    .btn:active {
      opacity: 0.8;
      transform: scale(0.98);
    }
    .btn-green { background-color: #4caf50; }
    .btn-red { background-color: #f44336; }
    .btn-yellow { background-color: #ff9800; }
    .btn-blue { background-color: #2196f3; }
  </style>
</head>
<body>

  <div class="header">🎨 پنل دکمه‌های رنگی اختصاصی</div>

  <div class="btn-row">
    <button class="btn btn-green" onclick="send('mode_random')">🟢 اتک تصادفی</button>
    <button class="btn btn-red" onclick="send('mode_lock')">🔴 اتک قفلی</button>
  </div>

  <div class="btn-row">
    <button class="btn btn-yellow" onclick="send('stop_attack')">🛑 توقف اتک</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function send(action) {
      tg.sendData(action);
      tg.close();
    }
  </script>
</body>
</html>
